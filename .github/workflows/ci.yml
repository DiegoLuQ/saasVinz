# Revisión automática en cada push y pull request.
#  - Backend: las migraciones arman la base desde cero (con RLS), hay una sola
#    head de Alembic y pasan las pruebas (aislamiento entre crematorios, límites
#    del plan, permisos, créditos IA, login, registro, avisos a la familia).
#  - Frontend: TypeScript sin errores; ESLint solo de los archivos cambiados e
#    informativo (hay errores antiguos de `any` que no deben bloquear todo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base de prueba: la crean las pruebas (tests/conftest.py) con el rol de la app.
      TEST_DATABASE_URL: postgresql://vinzer_app:vinzer_app_ci@localhost:5432/v3_saas_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Una sola head de migraciones
        run: |
          heads=$(SQLALCHEMY_DATABASE_URL=$TEST_DATABASE_URL python -m alembic heads | grep -c "(head)")
          echo "Heads: $heads"
          test "$heads" -eq 1
      - name: Pruebas
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-saas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-saas/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (archivos cambiados, informativo)
        continue-on-error: true
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
          files=$(git diff --relative --name-only --diff-filter=ACMR "$base" HEAD -- 'src/**/*.ts' 'src/**/*.tsx')
          if [ -z "$files" ]; then echo "Sin archivos TS cambiados"; exit 0; fi
          echo "$files"
          npx eslint $files
